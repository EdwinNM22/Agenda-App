<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda" />
    <meta name="application-name" content="Agenda" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="Permissions-Policy" content="microphone=(self), camera=()" />
    <title>Agenda</title>
    <script>
      try {
        const standalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true
        if (standalone) document.documentElement.classList.add("pwa-standalone")
        const ios =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        if (standalone && ios) document.documentElement.classList.add("pwa-ios")

        const theme = localStorage.getItem("agenda.theme")
        const dark = theme !== "light"
        if (dark) document.documentElement.classList.add("dark")
        if (theme === "wallpaper") {
          document.documentElement.classList.add("wallpaper")
          const color = localStorage.getItem("agenda.wallpaperColor")
          if (color) {
            document.documentElement.style.setProperty("--wallpaper-color", color)
            const meta = document.createElement("meta")
            meta.name = "theme-color"
            meta.content = color
            document.head.appendChild(meta)
          }
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
